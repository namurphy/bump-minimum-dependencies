[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.3,<0.13" ]

[project]
name = "bump-minimum-dependencies"
version = "0.5.0"
description = "Command line tool to bump minimum dependencies in pyproject.toml"
readme = "README.md"
license-files = [ "LICENSE" ]
authors = [
  { name = "Nick Murphy", email = "namurphy@cfa.harvard.edu" },
]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "charset-normalizer==3.3.2",
  "click>=8.4.2,<9",
  "dep-logic>=0.7.1",
  "requests>=2.34.2",
  # older version of uv shift positions of certain inline comments
  "rich>=15",
  "uv>=0.12.5",
]
urls.Source = "https://github.com/namurphy/bump-minimum-dependencies"
scripts.bump-minimum-dependencies = "bump_minimum_dependencies.main:main"

[dependency-groups]
dev = [
  "distlib>=0.4.2,!=0.4.3,!=0.4.4",
  "nox>=2026.7.11",
  "nox-uv>=0.8",
  "prek>=0.4.12",
  "pytest==9.0.3",
  "pytest-freezer==0.4.9",
  "python-dateutil==2.8.2",
  "rich>=15",
  "tomli-w>=1.2",
  "ty>=0.0.69",
]

[tool.ruff]
target-version = "py313"
namespace-packages = [ ".github/workflows", "docs" ]
extend-exclude = [
  ".code",
  ".idea",
  "__pycache__",
]
show-fixes = true
# output-format = "grouped"
format.line-ending = "lf"
format.docstring-code-format = true
# Using an IDE like PyCharm with a ruff plugin will make rule names appear as inlay hints
lint.extend-select = [
