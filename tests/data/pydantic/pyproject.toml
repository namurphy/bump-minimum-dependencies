[build-system]
requires = ['hatchling', 'hatch-fancy-pypi-readme>=22.5.0']
build-backend = 'hatchling.build'

[project]
name = 'pydantic'
license = 'MIT'
license-files = ['LICENSE']
classifiers = [
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
requires-python = '>=3.10'
dependencies = [
    "typing-extensions>=4.15.0",
    "annotated-types>=0.6.0",
    # Keep this in sync with the version in the `check_pydantic_core_version()` function:
    "pydantic-core==2.48.0",
    "typing-inspection>=0.4.4",
]
dynamic = ['version', 'readme']

[project.optional-dependencies]
email = [
  'email-validator>=2.0.0',
]
timezone = [
    'tzdata; platform_system == "Windows"',
]
[dependency-groups]
dev = [
    'coverage[toml]',
    'pytz',
    'dirty-equals',
    'pytest',
    'pytest-mock',
    'pytest-pretty',
    'pytest-examples',
    'faker',
    'pytest-benchmark',
    'pytest-codspeed',
    'pytest-run-parallel>=0.3.1',
    'packaging',
    'jsonschema',
    'time-machine; platform_python_implementation != "PyPy"',
]
coverage = [
    'coverage[toml]',
]
docs = [
    'autoflake',
    'mkdocs',
    'mkdocs-exclude',
    'mkdocs-llmstxt',
    'mkdocs-material[imaging]',
    'mkdocs-redirects',
    'mkdocstrings-python',
    'tomli',
    'pyupgrade',
    'mike',
    'pydantic-settings',
    'requests',
    'build>=1.3.0',
    'pydantic-extra-types>=2.10.6',
    'pydantic-docs',
]
docs-upload = [
    'algoliasearch>=4.12.0',
    'beautifulsoup4>=4.13.3',
]
linting = [
    'ruff',
    'pyright',
]
testing-extra = [
    'cloudpickle',
    'ansi2html',
    'devtools',
    'sqlalchemy',
    'pytest-memray; platform_python_implementation == "CPython" and platform_system != "Windows" and python_version < "3.15"',
    'memray; platform_python_implementation == "CPython" and platform_system != "Windows" and python_version < "3.15"',
]
typechecking = [
    'mypy',
    'pyright',
    'pyrefly',
    'pydantic-settings',
]
build = [
    'build',
    'twine',
]
pyodide-build = [
    "pyodide-build",
]
tweet = [
    "tweepy",
]
all = [
  { include-group = 'dev' },
  { include-group = 'docs' },
  { include-group = 'linting' },
  { include-group = 'testing-extra' },
  { include-group = 'typechecking' },
  { include-group = 'build' },
  { include-group = 'pyodide-build' },
]
