[project]
name = "bump-all-optionals"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
bump-all-optionals = "bump_all_optionals:main"

[project.optional-dependencies]
typing = [
    "mypy>=1.9",
]
doc = [
    "sphinx>=7.3,<9",
]
test = [
    "pytest>=8,!=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
