[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.7,<9999999" ]

[project]
name = "temporary-package"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [  ]

[dependency-groups]
astropy = [
  "astropy>=6",
]
docutils = [
  "docutils>=0.20,<2",
]
heliopy = [
  "heliopy>=1,<2",
]
nox = [
  "nox>=2025.10.16",
]
numpy = [
  "numpy>=1.26",
]
plasmapy = [
  "plasmapy>=2024.2",
]
requests = [
  "requests>=2.31",
]
spacepy = [
  "spacepy==0.2.2",
]
sunpy = [
  "sunpy>=5.1",
]
xarray = [
  "xarray!=2024.3",
]
zarr = [
  "zarr==3.1.3",
]
